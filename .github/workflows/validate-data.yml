name: Validate game data

on:
  push:
    paths: ['data/**', 'validate.py']
  pull_request:
    paths: ['data/**', 'validate.py']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data files
        run: python3 validate.py

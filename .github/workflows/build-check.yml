# 빌드 검사: PR마다 레포를 새로 받아 타입 검사 → 테스트 → 서식 → 빌드를 돌린다.
# 로컬에만 있고 커밋되지 않은 파일이 있으면 여기서 실패한다 (vanitas-dev-decisions.md 6-1 사고).
# 데이터 정합성은 validate-data.yml이 따로 맡는다.

name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # src/lib/paraglide/는 .gitignore 대상이라 새로 받은 레포에는 없다.
      # 타입 검사가 m.키()를 찾을 수 있도록 먼저 만든다.
      - name: 다국어 메시지 생성 (Paraglide)
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: 타입 검사
        run: npm run check

      - name: 단위 테스트
        run: npx vitest run

      - name: 서식·린트
        run: npm run lint

      - name: 빌드
        run: npm run build
